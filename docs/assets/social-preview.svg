<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" aria-labelledby="title desc" role="img" viewBox="0 0 1280 640"><title id="title">Tenjō — Every loss counts</title><desc id="desc">A free drop lottery. Three past losses mean four tickets in the next draw of the same series, up to six total.</desc><rect width="1280" height="640" fill="#173F33"/><g transform="translate(66 52) scale(.65)"><rect width="80" height="80" fill="#D8E9B0" rx="20"/><path fill="none" stroke="#245B48" stroke-linecap="round" stroke-linejoin="round" stroke-width="6" d="M22 20h36M17 33h46M40 20v15c0 17-9 27-23 32M40 36c4 15 11 25 23 31"/></g><text x="133" y="94" fill="#F6F7F4" font-family="Georgia,serif" font-size="43">tenjō.</text><text x="68" y="201" fill="#D8E9B0" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">A FAIRER WAY IN</text><text x="62" y="296" fill="#F6F7F4" font-family="Georgia,serif" font-size="83">Every loss</text><text x="62" y="389" fill="#F6F7F4" font-family="Georgia,serif" font-size="83">counts.</text><text x="68" y="455" fill="#E0E9E1" font-family="Arial,sans-serif" font-size="23">Lose a draw. Earn another ticket.</text><text x="68" y="568" fill="#B8CDBE" font-family="Arial,sans-serif" font-size="16">Free entry · Visible odds · Public draw records</text><g transform="translate(742 132) rotate(5 223 190)"><path fill="#D8E9B0" d="M24 0H422Q446 0 446 24V290a18 18 0 0 0 0 36v76q0 24-24 24H24q-24 0-24-24v-76a18 18 0 0 0 0-36V24Q0 0 24 0Z"/><text x="34" y="51" fill="#245B48" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">YOUR NEXT CHANCE</text><text x="30" y="146" fill="#173F33" font-family="Georgia,serif" font-size="79">4 tickets</text><text x="34" y="191" fill="#245B48" font-family="Arial,sans-serif" font-size="22">1 base + 3 past losses</text><circle cx="52" cy="250" r="21" fill="#245B48" stroke="#245B48" stroke-width="2"/><circle cx="117" cy="250" r="21" fill="#245B48" stroke="#245B48" stroke-width="2"/><circle cx="182" cy="250" r="21" fill="#245B48" stroke="#245B48" stroke-width="2"/><circle cx="247" cy="250" r="21" fill="#245B48" stroke="#245B48" stroke-width="2"/><circle cx="312" cy="250" r="21" fill="none" stroke="#245B48" stroke-dasharray="3 4" stroke-width="2"/><circle cx="377" cy="250" r="21" fill="none" stroke="#245B48" stroke-dasharray="3 4" stroke-width="2"/><path fill="none" stroke="#769665" stroke-dasharray="5 7" d="M22 308h402"/><text x="34" y="354" fill="#245B48" font-family="Arial,sans-serif" font-size="18">SAME SERIES. UP TO SIX TICKETS.</text><text x="34" y="389" fill="#245B48" font-family="Arial,sans-serif" font-size="18">A win resets your count.</text></g></svg>