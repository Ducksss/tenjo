<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">Tenjō — Every loss counts</title><desc id="desc">A pity system for ticket ballots. World ID lets each person enter once; one base chance plus three past losses gives four chances in the next draw on the same tour.</desc>
<defs><linearGradient id="ticket" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#648AFF"/><stop offset=".55" stop-color="#3851F5"/><stop offset="1" stop-color="#293AC1"/></linearGradient></defs>
<rect width="1280" height="640" fill="#F6F8FF"/>
<g transform="translate(52 30) scale(.52)" color="#3851F5"><path d="M16 18h48M10 36h60M40 20v16c0 18-10 28-26 34M40 36c0 18 10 28 26 34" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/></g>
<g font-family="Manrope,Helvetica,sans-serif" fill="#101637">
<text x="112" y="68" font-size="38" font-weight="600" letter-spacing="-2">tenjō<tspan fill="#3851F5">.</tspan></text>
<text x="57" y="177" font-size="13" letter-spacing="2" fill="#3851F5">A PITY SYSTEM FOR TICKET BALLOTS</text>
<text x="50" y="274" font-size="86" font-weight="500" letter-spacing="-5">Every loss</text>
<text x="50" y="370" font-size="86" font-weight="500" letter-spacing="-5">counts<tspan fill="#3851F5">.</tspan></text>
<text x="57" y="429" font-size="22" fill="#545D78">Lose a ballot. Get an extra chance next time.</text>
<rect x="57" y="473" width="218" height="53" rx="26.5" fill="#3851F5"/>
<text x="82" y="506" font-size="15" fill="white">A little more possibility ↗</text>
<text x="57" y="587" font-size="13" fill="#545D78">FREE ENTRY  ·  WORLD ID: ONE PERSON, ONE ENTRY  ·  PUBLIC RECORDS</text>
</g>
<path d="M720 26h500q34 0 34 34v450q0 100-100 100H720q-34 0-34-34V60q0-34 34-34Z" fill="#E6EDFF"/>
<g fill="none" stroke="#C3D0F6"><path d="M686 290q340-310 568-95M686 434q310 240 568-10"/></g>
<g transform="translate(810 112) rotate(-12 150 204)">
<rect x="0" y="0" width="300" height="408" rx="20" fill="#ACC1FF" transform="rotate(22 150 204)"/>
<rect x="0" y="0" width="300" height="408" rx="20" fill="#7594F7" transform="rotate(11 150 204)"/>
<rect x="0" y="0" width="300" height="408" rx="20" fill="url(#ticket)" stroke="#94AEFF"/>
<g fill="white" font-family="Manrope,Helvetica,sans-serif"><text x="26" y="45" font-size="20" font-weight="600">tenjō.</text><text x="260" y="45" font-size="24">↗</text><text x="22" y="249" font-size="172" font-weight="500" letter-spacing="-8">4</text><text x="29" y="289" font-size="20">chances, next time.</text><path d="M0 329h300" stroke="#FFFFFF" stroke-opacity=".55" stroke-dasharray="4 4"/><text x="26" y="370" font-size="11" letter-spacing="1">1 BASE + 3 PAST LOSSES</text></g>
</g>
<text x="715" y="585" font-family="Manrope,Helvetica,sans-serif" font-size="10" fill="#394D83" letter-spacing="1">ILLUSTRATIVE ENTRY / SAME TOUR / UP TO SIX CHANCES</text>
</svg>