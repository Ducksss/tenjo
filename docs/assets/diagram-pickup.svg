<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 704" width="760" height="704" role="img" font-size="13" font-family="Manrope, -apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif"><title>Pickup: what the server decides</title><rect x="0.5" y="0.5" width="759" height="703" rx="12" fill="#FFFFFF" stroke="#DCE2F1"></rect><defs><marker id="pickup-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#545D78"></path></marker></defs><text x="24" y="30" text-anchor="start" font-weight="600" fill="#101637">Pickup: what the server decides</text><g fill="none" stroke="#545D78" stroke-width="1.25"><path d="M230 98V120" marker-end="url(#pickup-arrow)"></path><path d="M230 180V206" marker-end="url(#pickup-arrow)"></path><path d="M230 266V294" marker-end="url(#pickup-arrow)"></path><path d="M230 342V370" marker-end="url(#pickup-arrow)"></path><path d="M230 430V456" marker-end="url(#pickup-arrow)"></path><path d="M230 516V542" marker-end="url(#pickup-arrow)"></path><path d="M230 602V630" marker-end="url(#pickup-arrow)"></path><path d="M330 150H490" marker-end="url(#pickup-arrow)"></path><path d="M330 236H490" marker-end="url(#pickup-arrow)"></path><path d="M330 400H490" marker-end="url(#pickup-arrow)"></path><path d="M330 486H490" marker-end="url(#pickup-arrow)"></path><path d="M330 572H490" marker-end="url(#pickup-arrow)"></path></g><rect x="120" y="58" width="220" height="40" rx="8" fill="#FFFFFF" stroke="#545D78" stroke-width="1.25"></rect><text x="230" y="82" text-anchor="middle" font-weight="600" fill="#101637">Winner taps Collect</text><polygon points="130,150 230,120 330,150 230,180" fill="#FFFFFF" stroke="#545D78" stroke-width="1.25"></polygon><text x="230" y="154" text-anchor="middle" fill="#101637">Pickup switched on?</text><polygon points="130,236 230,206 330,236 230,266" fill="#FFFFFF" stroke="#545D78" stroke-width="1.25"></polygon><text x="230" y="240" text-anchor="middle" fill="#101637">Draw settled?</text><polygon points="130,400 230,370 330,400 230,430" fill="#FFFFFF" stroke="#545D78" stroke-width="1.25"></polygon><text x="230" y="404" text-anchor="middle" fill="#101637">Proof checks out?</text><polygon points="130,486 230,456 330,486 230,516" fill="#FFFFFF" stroke="#545D78" stroke-width="1.25"></polygon><text x="230" y="490" text-anchor="middle" fill="#101637">This code won?</text><polygon points="130,572 230,542 330,572 230,602" fill="#FFFFFF" stroke="#545D78" stroke-width="1.25"></polygon><text x="230" y="576" text-anchor="middle" fill="#101637">Already collected?</text><rect x="120" y="294" width="220" height="48" rx="8" fill="#FFFFFF" stroke="#545D78" stroke-width="1.25"></rect><text x="230" y="314" text-anchor="middle" font-weight="600" fill="#101637">Proves in World App</text><text x="230" y="332" text-anchor="middle" font-size="11.5" fill="#545D78">live selfie requested</text><rect x="120" y="630" width="220" height="48" rx="8" fill="#EDF1FF" stroke="#3851F5" stroke-width="2"></rect><text x="230" y="650" text-anchor="middle" font-weight="600" fill="#101637">Collected once</text><text x="230" y="668" text-anchor="middle" font-size="11.5" fill="#101637">marked untested-staging</text><rect x="490" y="126" width="190" height="48" rx="8" fill="#F6F8FF" stroke="#545D78" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="585" y="146" text-anchor="middle" font-weight="600" fill="#101637">Off until liveness</text><text x="585" y="164" text-anchor="middle" font-size="11.5" fill="#545D78">is checked on the server</text><text x="410" y="142" text-anchor="middle" font-size="11.5" fill="#545D78">no</text><rect x="490" y="212" width="190" height="48" rx="8" fill="#F6F8FF" stroke="#545D78" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="585" y="232" text-anchor="middle" font-weight="600" fill="#101637">Wait for the draw</text><text x="585" y="250" text-anchor="middle" font-size="11.5" fill="#545D78">nothing saved</text><text x="410" y="228" text-anchor="middle" font-size="11.5" fill="#545D78">no</text><rect x="490" y="376" width="190" height="48" rx="8" fill="#FFFFFF" stroke="#AD3535" stroke-width="1.5"></rect><text x="585" y="396" text-anchor="middle" font-weight="600" fill="#101637">Refused or try again</text><text x="585" y="414" text-anchor="middle" font-size="11.5" fill="#545D78">nothing saved</text><text x="410" y="392" text-anchor="middle" font-size="11.5" fill="#545D78">no</text><rect x="490" y="462" width="190" height="48" rx="8" fill="#FFFFFF" stroke="#AD3535" stroke-width="1.5"></rect><text x="585" y="482" text-anchor="middle" font-weight="600" fill="#101637">Pickup refused</text><text x="585" y="500" text-anchor="middle" font-size="11.5" fill="#545D78">not a winner</text><text x="410" y="478" text-anchor="middle" font-size="11.5" fill="#545D78">no</text><rect x="490" y="548" width="190" height="48" rx="8" fill="#FFFFFF" stroke="#AD3535" stroke-width="1.5"></rect><text x="585" y="568" text-anchor="middle" font-weight="600" fill="#101637">Already collected</text><text x="585" y="586" text-anchor="middle" font-size="11.5" fill="#545D78">one pickup per win</text><text x="410" y="564" text-anchor="middle" font-size="11.5" fill="#545D78">yes</text><text x="240" y="197" text-anchor="start" font-size="11.5" fill="#545D78">yes</text><text x="240" y="284" text-anchor="start" font-size="11.5" fill="#545D78">yes</text><text x="240" y="447" text-anchor="start" font-size="11.5" fill="#545D78">yes</text><text x="240" y="533" text-anchor="start" font-size="11.5" fill="#545D78">yes</text><text x="240" y="620" text-anchor="start" font-size="11.5" fill="#545D78">no</text></svg>
