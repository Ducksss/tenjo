<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">Tenjō — Every loss counts</title><desc id="desc">A free drop lottery. Three past losses mean four tickets in the next draw of the same series, up to six total.</desc>
<rect width="1280" height="640" fill="#173F33"/>
<g transform="translate(66 52) scale(.65)"><rect width="80" height="80" rx="20" fill="#D8E9B0"/><path d="M22 20h36M17 33h46M40 20v15c0 17-9 27-23 32M40 36c4 15 11 25 23 31" fill="none" stroke="#245B48" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="133" y="94" font-family="Georgia,serif" font-size="43" fill="#F6F7F4">tenjō.</text>
<text x="68" y="201" font-family="Arial,sans-serif" font-size="15" letter-spacing="3" fill="#D8E9B0">A FAIRER WAY IN</text>
<text x="62" y="296" font-family="Georgia,serif" font-size="83" fill="#F6F7F4">Every loss</text>
<text x="62" y="389" font-family="Georgia,serif" font-size="83" fill="#F6F7F4">counts.</text>
<text x="68" y="455" font-family="Arial,sans-serif" font-size="23" fill="#E0E9E1">Lose a draw. Earn another ticket.</text>
<text x="68" y="568" font-family="Arial,sans-serif" font-size="16" fill="#B8CDBE">Free entry  ·  Visible odds  ·  Public draw records</text>
<g transform="translate(742 132) rotate(5 223 190)">
<path d="M24 0H422Q446 0 446 24V290a18 18 0 0 0 0 36v76q0 24-24 24H24q-24 0-24-24v-76a18 18 0 0 0 0-36V24Q0 0 24 0Z" fill="#D8E9B0"/>
<text x="34" y="51" font-family="Arial,sans-serif" font-size="15" letter-spacing="2" fill="#245B48">YOUR NEXT CHANCE</text>
<text x="30" y="146" font-family="Georgia,serif" font-size="79" fill="#173F33">4 tickets</text>
<text x="34" y="191" font-family="Arial,sans-serif" font-size="22" fill="#245B48">1 base + 3 past losses</text>
<circle cx="52" cy="250" r="21" fill="#245B48" stroke="#245B48" stroke-width="2"/><circle cx="117" cy="250" r="21" fill="#245B48" stroke="#245B48" stroke-width="2"/><circle cx="182" cy="250" r="21" fill="#245B48" stroke="#245B48" stroke-width="2"/><circle cx="247" cy="250" r="21" fill="#245B48" stroke="#245B48" stroke-width="2"/><circle cx="312" cy="250" r="21" fill="none" stroke="#245B48" stroke-width="2" stroke-dasharray="3 4"/><circle cx="377" cy="250" r="21" fill="none" stroke="#245B48" stroke-width="2" stroke-dasharray="3 4"/>
<path d="M22 308h402" fill="none" stroke="#769665" stroke-dasharray="5 7"/>
<text x="34" y="354" font-family="Arial,sans-serif" font-size="18" fill="#245B48">SAME SERIES. UP TO SIX TICKETS.</text>
<text x="34" y="389" font-family="Arial,sans-serif" font-size="18" fill="#245B48">A win resets your count.</text>
