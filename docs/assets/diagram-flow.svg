<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 508" width="760" height="508" role="img" font-size="13" font-family="Geist, -apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif"><title>Tenjō entry-to-pickup flow</title><rect x="0.5" y="0.5" width="759" height="507" rx="12" fill="#FFFFFF" stroke="#E6D9CC"></rect><defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#734455"></path></marker></defs><text x="24" y="34" text-anchor="start" font-weight="600" fill="#481427">One person, one entry; every loss adds a chance next time</text><g fill="none" stroke="#734455" stroke-width="1.25"><path d="M176 100H212" marker-end="url(#flow-arrow)"></path><path d="M336 100H372" marker-end="url(#flow-arrow)"></path><path d="M528 100H564" marker-end="url(#flow-arrow)"></path><path d="M274 138V197" marker-end="url(#flow-arrow)"></path><path d="M642 128V187" marker-end="url(#flow-arrow)"></path><path d="M580 225H528" marker-end="url(#flow-arrow)"></path><path d="M642 263V322" marker-end="url(#flow-arrow)"></path><path d="M564 350H512" marker-end="url(#flow-arrow)"></path><path d="M388 350H352" marker-end="url(#flow-arrow)"></path><path d="M450 388V440" marker-end="url(#flow-arrow)"></path></g><rect x="20" y="72" width="156" height="56" rx="8" fill="#FFFFFF" stroke="#734455" stroke-width="1.25"></rect><text x="98" y="104" text-anchor="middle" font-weight="600" fill="#481427">Enter with World ID</text><polygon points="212,100 274,62 336,100 274,138" fill="#FFFFFF" stroke="#734455" stroke-width="1.25"></polygon><text x="274" y="104" text-anchor="middle" fill="#481427">First entry?</text><rect x="372" y="72" width="156" height="56" rx="8" fill="#FFFFFF" stroke="#734455" stroke-width="1.25"></rect><text x="450" y="96" text-anchor="middle" font-weight="600" fill="#481427">Entry saved</text><text x="450" y="114" text-anchor="middle" font-size="11.5" fill="#734455">chances = 1 + losses</text><rect x="564" y="72" width="156" height="56" rx="8" fill="#FFFFFF" stroke="#734455" stroke-width="1.25"></rect><text x="642" y="96" text-anchor="middle" font-weight="600" fill="#481427">Weighted draw</text><text x="642" y="114" text-anchor="middle" font-size="11.5" fill="#734455">server now, Sui later</text><rect x="196" y="197" width="156" height="56" rx="8" fill="#FFFFFF" stroke="#B42318" stroke-width="1.5"></rect><text x="274" y="221" text-anchor="middle" font-weight="600" fill="#481427">Refused</text><text x="274" y="239" text-anchor="middle" font-size="11.5" fill="#734455">nothing saved</text><rect x="372" y="197" width="156" height="56" rx="8" fill="#F9EDE2" stroke="#EF5E36" stroke-width="2"></rect><text x="450" y="221" text-anchor="middle" font-weight="600" fill="#481427">Loss count +1</text><text x="450" y="239" text-anchor="middle" font-size="11.5" fill="#481427">public, no name</text><polygon points="580,225 642,187 704,225 642,263" fill="#FFFFFF" stroke="#734455" stroke-width="1.25"></polygon><text x="642" y="229" text-anchor="middle" fill="#481427">Won?</text><rect x="564" y="322" width="156" height="56" rx="8" fill="#FFFFFF" stroke="#734455" stroke-width="1.25"></rect><text x="642" y="346" text-anchor="middle" font-weight="600" fill="#481427">World ID again</text><text x="642" y="364" text-anchor="middle" font-size="11.5" fill="#734455">at pickup</text><polygon points="388,350 450,312 512,350 450,388" fill="#FFFFFF" stroke="#734455" stroke-width="1.25"></polygon><text x="450" y="354" text-anchor="middle" fill="#481427">Same person?</text><rect x="196" y="322" width="156" height="56" rx="8" fill="#FFFFFF" stroke="#734455" stroke-width="1.25"></rect><text x="274" y="354" text-anchor="middle" font-weight="600" fill="#481427">Collect the item</text><rect x="372" y="440" width="156" height="44" rx="8" fill="#FFFFFF" stroke="#B42318" stroke-width="1.5"></rect><text x="450" y="466" text-anchor="middle" font-weight="600" fill="#481427">Pickup refused</text><text x="354" y="90" text-anchor="middle" font-size="11.5" fill="#734455">yes</text><text x="282" y="172" text-anchor="start" font-size="11.5" fill="#734455">no</text><text x="554" y="215" text-anchor="middle" font-size="11.5" fill="#734455">no</text><text x="650" y="296" text-anchor="start" font-size="11.5" fill="#734455">yes</text><text x="370" y="340" text-anchor="middle" font-size="11.5" fill="#734455">yes</text><text x="458" y="418" text-anchor="start" font-size="11.5" fill="#734455">no</text></svg>
